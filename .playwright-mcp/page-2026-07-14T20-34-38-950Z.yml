    - paragraph [ref=f12e127]: "Schwarz Digits schafft das technologische Fundament für digitale Entscheidungsfreiheit in Europa. Als IT- und Digitalsparte der Schwarz Gruppe entwickeln und verantworten wir einerseits die IT-Infrastrukturen für die Handelssparten Lidl und Kaufland sowie die Schwarz Produktion und PreZero. Gleichzeitig agieren wir als unabhängiger Anbieter am externen Markt, um Unternehmen in ganz Europa bei ihrer digitalen Transformation zu unterstützen. Unsere Kernleistungen bündeln wir in den Bereichen Cloud, Cyber Security, Data & AI, Communication und Workspace. Trage auch du zur digitalen Entscheidungsfreiheit in Europa bei.Bei uns arbeitest du an der Schnittstelle zwischen Agilität und Sicherheit: Du profitierst von den schnellen Entscheidungswegen, genießt echte Gestaltungsspielräume in deinen Projekten und baust dabei auf das stabile Fundament der Schwarz Gruppe."
    - generic [ref=f12e128]:
      - generic [ref=f12e129]:
        - heading "Deine Aufgaben" [level=3] [ref=f12e130]
        - list [ref=f12e133]:
          - listitem [ref=f12e134]: Du entwickelst eine Data und AI Platform als souveränen Cloud Service
          - listitem [ref=f12e135]: Du erweiterst die Systemarchitektur und identifizierst relevante Open Source Projekte
          - listitem [ref=f12e136]: Du entwickelst REST APIs über welche unsere Kunden den Servicelifecycle steuern
          - listitem [ref=f12e137]: Du entwickelst Kubernetes Operatoren, um den Life Cycle von Cloud Services zu automatisieren
          - listitem [ref=f12e138]: "Du übernimmst Verantwortung im agilen Produktteam: You Build It - You Run It!"
          - listitem [ref=f12e139]: Du führst kompetent tiefgreifende Ursachenanalysen durch und identifizierst nachhaltige Lösungen, die du direkt implementierst
      - generic [ref=f12e140]:
        - heading "Dein Profil" [level=3] [ref=f12e141]
        - list [ref=f12e144]:
          - listitem [ref=f12e145]: Du überzeugst uns mit fundierten Kenntnissen in der Programmierung mit Golang oder vergleichbare Programmiersprachen
          - listitem [ref=f12e146]: Dabei liegen deine Schwerpunkte in der Softwareentwicklung und Kubernetes und du fühlst dich in Cloud-Umgebungen bereits jetzt zuhause
          - listitem [ref=f12e147]: Begriffe wie MLOps und Produkte und Services wie Airflow, mlflow oder kserve sind keine Fremdwörter für dich
          - listitem [ref=f12e148]: Du brennst dafür neue Technologien zu durchdringen und kannst diese in der Praxis umsetzen
          - listitem [ref=f12e149]: Du hast Spaß daran, dein Wissen mit anderen Teammitgliedern zu teilen
    - generic [ref=f12e150]:
      - heading "Unsere Benefits" [level=2] [ref=f12e151]
      - generic [ref=f12e152]:
        - button "<p>Ein unabh&auml;ngiges Europa - digital, f&uuml;hrend. Wenn diese Vision dich genauso begeistert wie uns, lass uns die souver&auml;ne Cloud daf&uuml;r gemeinsam bauen.</p>" [ref=f12e155] [cursor=pointer]:
          - figure [ref=f12e156]
        - button "<p>Du wirst Teil der f&uuml;hrenden Handelsgruppe Europas, der Schwarz Gruppe und geh&ouml;rst dabei zur IT- und Digitalsparte, Schwarz Digits. Damit profitierst du von der Dynamik eines jungen Unternehmens und der St&auml;rke der etablierten Unternehmensgruppe, die hinter Lidl und Kaufland steckt.</p>" [ref=f12e159] [cursor=pointer]:
          - figure [ref=f12e160]
        - 'button "<p>Deine Ideen h&ouml;ren wir gerne - und das auf allen Ebenen: Duz-Kultur und offene T&uuml;ren gestalten die Arbeit abwechslungsreich und produktiv. Dabei f&ouml;rdern wir den Blick &uuml;ber den Tellerrand und die Zusammenarbeit in agilen Strukturen, um gemeinsam innovative L&ouml;sungen zu entwickeln.<br>&nbsp;</p>" [ref=f12e163] [cursor=pointer]':
          - figure [ref=f12e164]
        - button "<p>Du wirst Teil eines internationalen Teams, denn wir kommen aus aller Welt und bilden eine echte Einheit. Wir lieben und leben die Cloud. Jeder bringt seine eigenen St&auml;rken ein, und gemeinsam verbessern wir kontinuierlich unser Portfolio.</p>" [ref=f12e167] [cursor=pointer]:
          - figure [ref=f12e168]
        - button "<p>Du wirst attraktiv entlohnt, genie&szlig;t 30 Tage Urlaub, bist zeitlich und &ouml;rtlich flexibel und profitierst von einer Vielzahl an starken Sport-, Mobilit&auml;ts- und Gesundheitsangeboten. Dar&uuml;ber hinaus f&ouml;rdern wir deine pers&ouml;nliche und berufliche Entwicklung mit individuellen Weiterbildungsm&ouml;glichkeiten.</p>" [ref=f12e171] [cursor=pointer]:
          - figure [ref=f12e172]
        - button "<p>Unsere Cloud-L&ouml;sungen basieren auf Open-Source-Technologien, wodurch wir offene Standards in der Cloud-Entwicklung f&ouml;rdern. Bei uns kannst du dich auf innovative Denkans&auml;tze, eine unterst&uuml;tzende Community und eine moderne IT-Ausstattung verlassen.</p>" [ref=f12e175] [cursor=pointer]:
          - figure [ref=f12e176]
