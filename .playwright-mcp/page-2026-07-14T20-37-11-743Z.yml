            - generic [ref=f15e137]: "704"
    - paragraph [ref=f15e142]: "Schwarz Digits schafft das technologische Fundament für digitale Entscheidungsfreiheit in Europa. Als IT- und Digitalsparte der Schwarz Gruppe entwickeln und verantworten wir einerseits die IT-Infrastrukturen für die Handelssparten Lidl und Kaufland sowie die Schwarz Produktion und PreZero. Gleichzeitig agieren wir als unabhängiger Anbieter am externen Markt, um Unternehmen in ganz Europa bei ihrer digitalen Transformation zu unterstützen. Unsere Kernleistungen bündeln wir in den Bereichen Cloud, Cyber Security, Data & AI, Communication und Workspace. Trage auch du zur digitalen Entscheidungsfreiheit in Europa bei.Bei uns arbeitest du an der Schnittstelle zwischen Agilität und Sicherheit: Du profitierst von den schnellen Entscheidungswegen, genießt echte Gestaltungsspielräume in deinen Projekten und baust dabei auf das stabile Fundament der Schwarz Gruppe."
    - generic [ref=f15e143]:
      - generic [ref=f15e144]:
        - heading "Deine Aufgaben" [level=3] [ref=f15e145]
        - list [ref=f15e148]:
          - listitem [ref=f15e149]: "Produktentwicklung: Du gestaltest aktiv die Zukunft maßgeblicher STACKIT Storage Produkte (z.B. Object Storage) über den gesamten Lebenszyklus. Auf Basis von Golang bieten wir zusammen mit Dir hochautomatisierte Selfservices mit REST APIs in einem Kubernetes-basierten Umfeld an"
          - listitem [ref=f15e150]: "Softwarequalität: Als Backend Developer bist Du Teil eines Teams mit technischer Exzellenz und dem eigenen Anspruch, jeden Tag ein bisschen besser zu werden und unsere Produkte kontinuierlich zu optimieren"
          - listitem [ref=f15e151]: "Architektur: Du unterstützt die Entwicklung der Softwarearchitektur, die Du in Zusammenarbeit mit Deinem Team erarbeitest und Realität werden lässt – weil Dir wichtig ist, eine langfristig stabile und zuverlässige Lösung zu bauen, die unsere Kunden gerne einsetzen"
          - listitem [ref=f15e152]: "Integration: Damit sich neue Produkte und Funktionalitäten nahtlos in die STACKIT Produktfamilie integrieren, koordinierst Du die fachlichen und technischen Abstimmungen mit den zuständigen STACKIT Services z.B. zur Integration ins STACKIT Portal, den STACKIT Terraform-Provider oder das zentral STACKIT IAM"
          - listitem [ref=f15e153]: "Ende-zu-Ende-Verantwortung: Die Identifikation mit unseren Produkten, die wir unseren Kunden bereitstellen, ist uns sehr wichtig. Daher leben wir aktiv eine Ende-zu-Ende-Verantwortung und bekommen hierbei Unterstützung aus vielen internen STACKIT Service Teams zur Veredelung unserer Services"
      - generic [ref=f15e154]:
        - heading "Dein Profil" [level=3] [ref=f15e155]
        - list [ref=f15e158]:
          - listitem [ref=f15e159]: Du hast Lust, etwas Großes zu bewegen und dabei die Lösung mit modernsten Cloud-Technologien maßgeblich mitzugestalten
          - listitem [ref=f15e160]: Du hast ausgeprägte Erfahrung im Entwicklungsumfeld mit Golang und verfügst über Kenntnisse mit Cloud Umgebungen und deren Architekturen
          - listitem [ref=f15e161]: Du verfügst über Kompetenzen in Schnittstellen- und Kommunikationstechnologien (z.B. REST und gRPC), sowie in Datenbanksystemen (z.B. PostgreSQL) und Kubernetes
          - listitem [ref=f15e162]: Du bewegst dich sicher in den Methoden der professionellen Softwareentwicklung (von Entwicklungsstandards bis hin zu Build- und Release-Management)
          - listitem [ref=f15e163]: Du hast Spaß dabei, deine Erfahrungen und Dein Wissen mit Deinem Team und anderen Entwicklern zu teilen
          - listitem [ref=f15e164]: Du besitzt eine schnelle Auffassungsgabe und fühlst Dich wohl im Umgang mit neuen Technologien in einem schnell wachsenden, dynamischen Umfeld
          - listitem [ref=f15e165]: Du besitzt eine Affinität zur IT-Infrastruktur und Interesse an Storage Services in hochautomatisierten Umgebungen (z.B. CI/CD, Pipelines)
          - listitem [ref=f15e166]: Deine ausgezeichnete Kommunikationsfähigkeit in Deutsch und Englisch bildet die Basis für eine erfolgreiche Zusammenarbeit in internationalen, agilen Teams
    - generic [ref=f15e167]:
      - heading "Unsere Benefits" [level=2] [ref=f15e168]
      - generic [ref=f15e169]:
        - button "<p>Ein unabh&auml;ngiges Europa - digital, f&uuml;hrend. Wenn diese Vision dich genauso begeistert wie uns, lass uns die souver&auml;ne Cloud daf&uuml;r gemeinsam bauen.</p>" [ref=f15e172] [cursor=pointer]:
          - figure [ref=f15e173]
        - button "<p>Du wirst Teil der f&uuml;hrenden Handelsgruppe Europas, der Schwarz Gruppe und geh&ouml;rst dabei zur IT- und Digitalsparte, Schwarz Digits. Damit profitierst du von der Dynamik eines jungen Unternehmens und der St&auml;rke der etablierten Unternehmensgruppe, die hinter Lidl und Kaufland steckt.</p>" [ref=f15e176] [cursor=pointer]:
          - figure [ref=f15e177]
        - 'button "<p>Deine Ideen h&ouml;ren wir gerne - und das auf allen Ebenen: Duz-Kultur und offene T&uuml;ren gestalten die Arbeit abwechslungsreich und produktiv. Dabei f&ouml;rdern wir den Blick &uuml;ber den Tellerrand und die Zusammenarbeit in agilen Strukturen, um gemeinsam innovative L&ouml;sungen zu entwickeln.<br>&nbsp;</p>" [ref=f15e180] [cursor=pointer]':
          - figure [ref=f15e181]
        - button "<p>Du wirst Teil eines internationalen Teams, denn wir kommen aus aller Welt und bilden eine echte Einheit. Wir lieben und leben die Cloud. Jeder bringt seine eigenen St&auml;rken ein, und gemeinsam verbessern wir kontinuierlich unser Portfolio.</p>" [ref=f15e184] [cursor=pointer]:
          - figure [ref=f15e185]
        - button "<p>Du wirst attraktiv entlohnt, genie&szlig;t 30 Tage Urlaub, bist zeitlich und &ouml;rtlich flexibel und profitierst von einer Vielzahl an starken Sport-, Mobilit&auml;ts- und Gesundheitsangeboten. Dar&uuml;ber hinaus f&ouml;rdern wir deine pers&ouml;nliche und berufliche Entwicklung mit individuellen Weiterbildungsm&ouml;glichkeiten.</p>" [ref=f15e188] [cursor=pointer]:
          - figure [ref=f15e189]
        - button "<p>Unsere Cloud-L&ouml;sungen basieren auf Open-Source-Technologien, wodurch wir offene Standards in der Cloud-Entwicklung f&ouml;rdern. Bei uns kannst du dich auf innovative Denkans&auml;tze, eine unterst&uuml;tzende Community und eine moderne IT-Ausstattung verlassen.</p>" [ref=f15e192] [cursor=pointer]:
          - figure [ref=f15e193]
