            - generic [ref=f16e133]: "2787"
    - paragraph [ref=f16e138]: "Schwarz Digits schafft das technologische Fundament für digitale Entscheidungsfreiheit in Europa. Als IT- und Digitalsparte der Schwarz Gruppe entwickeln und verantworten wir einerseits die IT-Infrastrukturen für die Handelssparten Lidl und Kaufland sowie die Schwarz Produktion und PreZero. Gleichzeitig agieren wir als unabhängiger Anbieter am externen Markt, um Unternehmen in ganz Europa bei ihrer digitalen Transformation zu unterstützen. Unsere Kernleistungen bündeln wir in den Bereichen Cloud, Cyber Security, Data & AI, Communication und Workspace. Trage auch du zur digitalen Entscheidungsfreiheit in Europa bei.Bei uns arbeitest du an der Schnittstelle zwischen Agilität und Sicherheit: Du profitierst von den schnellen Entscheidungswegen, genießt echte Gestaltungsspielräume in deinen Projekten und baust dabei auf das stabile Fundament der Schwarz Gruppe."
    - generic [ref=f16e139]:
      - generic [ref=f16e140]:
        - heading "Deine Aufgaben" [level=3] [ref=f16e141]
        - list [ref=f16e144]:
          - listitem [ref=f16e145]:
            - strong [ref=f16e146]: Entwicklung
            - text: ": Du implementierst anspruchsvolle und skalierbare Cloud-native Anwendungen und legst dabei Wert auf effizienten, getesteten und wartbaren Code. Du bewegst dich souverän im Kubernetes-Umfeld und bist in der Lage, unsere Systeme hochverfügbar und resilient zur Verfügung zu stellen."
          - listitem [ref=f16e147]:
            - strong [ref=f16e148]: Verantwortung
            - text: ": Du bringst dich im gesamten Software-Development-Lifecycle (von der Anforderung über die Konzeption bis zum Deployment) aktiv ein. Für dich ist “You Build It, You Run It” und die Übernahme entsprechender Verantwortung selbstverständlich."
          - listitem [ref=f16e149]:
            - strong [ref=f16e150]: Gestaltung
            - text: ": Du gestaltest, priorisierst und konzipierst Anforderungen eng zusammen mit einem Product Owner und prägst mit Weitblick langlebige Architekturen."
          - listitem [ref=f16e151]:
            - strong [ref=f16e152]: Optimierung
            - text: ": Du hilfst dabei, technische Schulden abzubauen, analysierst Fehler und sorgst für einen reibungslosen Betrieb der Anwendung."
          - listitem [ref=f16e153]:
            - strong [ref=f16e154]: Code Reviews
            - text: ": Du nimmst aktiv an Code Reviews teil. Du prüfst den Code von Anderen konstruktiv und lässt auch deinen eigenen Code reviewen, um gemeinsam besser zu werden."
          - listitem [ref=f16e155]:
            - strong [ref=f16e156]: Agile Mitarbeit
            - text: ": Du bist Teil eines agilen und internationalen Teams, das nach agilen Methoden arbeitet. Du bringst deine Ideen in Refinements und Retrospektiven ein."
      - generic [ref=f16e157]:
        - heading "Dein Profil" [level=3] [ref=f16e158]
        - list [ref=f16e161]:
          - listitem [ref=f16e162]:
            - strong [ref=f16e163]: Anspruch
            - text: ": Du hast eine tiefe Leidenschaft für Technologien, Clean Code und innovative langlebige Softwarearchitekturen."
          - listitem [ref=f16e164]:
            - strong [ref=f16e165]: Erfahrung
            - text: ": Du hast fundierte und mehrjährige Erfahrung in der Softwareentwicklung mit Go, optional auch in Vue.js und bist sicher im Umgang mit diversen Datenbanksystemen (z.B. MongoDB, PostgreSQL)."
          - listitem [ref=f16e166]:
            - strong [ref=f16e167]: Mindset
            - text: ": Du hast einen hohen Qualitätsanspruch an deine eigene Arbeit und verstehst Softwareentwicklung als Teamsport. Du scheust dich nicht davor, dich auch in bereits bestehenden Code einzuarbeiten, um Zusammenhänge zu verstehen. Du bist offen für Feedback und möchtest dich weiterentwickeln."
          - listitem [ref=f16e168]:
            - strong [ref=f16e169]: Kommunikation
            - text: ": Du kannst dich gut auf Deutsch und Englisch verständigen und arbeitest gerne in einem internationalen Team. Du bringst dich gerne ein und kannst dabei auch andere zu Wort kommen lassen."
          - listitem [ref=f16e170]:
            - strong [ref=f16e171]: Tech-Stack
            - text: ": Du hast ein sehr gutes Verständnis von Service-, Container- und Cloud-Architekturen, bist sicher im Umgang mit Kubernetes und verstehst die Prinzipien von Cloud-native Anwendungen. Du weißt, wie man den Zustand solcher Architekturen überwacht und bist in der Lage, sie zu optimieren."
    - generic [ref=f16e172]:
      - heading "Unsere Benefits" [level=2] [ref=f16e173]
      - generic [ref=f16e174]:
        - button "<p>Du &uuml;bernimmst verantwortungsvolle Aufgaben, treibst Projekte mit Mehrwert aktiv voran und tr&auml;gst dazu bei, Risiken fr&uuml;hzeitig zu erkennen und zu minimieren.</p>" [ref=f16e177] [cursor=pointer]:
          - figure [ref=f16e178]
        - button "<p>Du teilst deine Leidenschaft f&uuml;r IT und Digitalisierung mit &uuml;ber 4.000 Kollegen. Gemeinsam k&ouml;nnen wir voneinander lernen und uns gegenseitig inspirieren.&nbsp;</p>" [ref=f16e181] [cursor=pointer]:
          - figure [ref=f16e182]
        - button "<p>Mit vielf&auml;ltigen Weiterbildungsm&ouml;glichkeiten unterst&uuml;tzen wir dich individuell dabei, dich &nbsp;kontinuierlich fachlich sowie pers&ouml;nlich zu entfalten.&nbsp;</p>" [ref=f16e185] [cursor=pointer]:
          - figure [ref=f16e186]
        - button "<p>Unsere Mitarbeitenden liegen uns sehr am Herzen. Du wirst Teil einer wertsch&auml;tzenden und offenen Unternehmenskultur mit flachen Hierarchien und Duz-Kultur.</p>" [ref=f16e189] [cursor=pointer]:
          - figure [ref=f16e190]
        - button "<p>Du wirkst an internationalen Projekten mit und treibst unsere einzigartigen Cloud Native L&ouml;sungen aktiv voran.</p>" [ref=f16e193] [cursor=pointer]:
          - figure [ref=f16e194]
        - button "<p>Deine Arbeitszeiten gestaltest du flexibel und kannst diese in Absprache mit deiner F&uuml;hrungskraft an deine Aufgaben anpassen. So bestimmst du selbst, wie deine gesunde Work-Life-Balance aussieht.</p>" [ref=f16e197] [cursor=pointer]:
          - figure [ref=f16e198]
