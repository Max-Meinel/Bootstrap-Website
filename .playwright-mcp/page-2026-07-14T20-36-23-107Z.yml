            - generic [ref=f14e137]: "655"
    - paragraph [ref=f14e142]: "Schwarz Digits schafft das technologische Fundament für digitale Entscheidungsfreiheit in Europa. Als IT- und Digitalsparte der Schwarz Gruppe entwickeln und verantworten wir einerseits die IT-Infrastrukturen für die Handelssparten Lidl und Kaufland sowie die Schwarz Produktion und PreZero. Gleichzeitig agieren wir als unabhängiger Anbieter am externen Markt, um Unternehmen in ganz Europa bei ihrer digitalen Transformation zu unterstützen. Unsere Kernleistungen bündeln wir in den Bereichen Cloud, Cyber Security, Data & AI, Communication und Workspace. Trage auch du zur digitalen Entscheidungsfreiheit in Europa bei.Bei uns arbeitest du an der Schnittstelle zwischen Agilität und Sicherheit: Du profitierst von den schnellen Entscheidungswegen, genießt echte Gestaltungsspielräume in deinen Projekten und baust dabei auf das stabile Fundament der Schwarz Gruppe."
    - generic [ref=f14e143]:
      - generic [ref=f14e144]:
        - heading "Deine Aufgaben" [level=3] [ref=f14e145]
        - list [ref=f14e148]:
          - listitem [ref=f14e149]: Du bist verantwortlich für Beratung, Planung, Entwicklung, Testing und Support für unsere Produkte im Einkauf
          - listitem [ref=f14e150]: Du erarbeitest und dokumentierst Lösungsarchitekturen und -konzepte
          - listitem [ref=f14e151]: Du steuerst interne und externe Entwickler und koordinierst die Abläufe
          - listitem [ref=f14e152]: Du stellst den kontinuierlichen Go Live neuer Softwarereleases gemeinsam mit deinem Team sicher
          - listitem [ref=f14e153]: Du bringst dich aktiv ein in die Aufbereitung und Vermittlung von Wissen
      - generic [ref=f14e154]:
        - heading "Dein Profil" [level=3] [ref=f14e155]
        - list [ref=f14e158]:
          - listitem [ref=f14e159]: Du hast sehr Gute mehrjährige Praktische Kenntnisse in Go (optional Kotlin), Vue, Datenbanken(z.B. Mongo, Postgree), Git und Schnittstellentechnologien (REST API)
          - listitem [ref=f14e160]: Du hast ein sehr Gutes Verständnis in Service-, Container- und Cloud-Architekturen & Technologien
          - listitem [ref=f14e161]: Du hast Gute Englischkenntnisse(du kannst dich in Meetings und fachl. Diskussionen austauschen), optimalerweise Deutschkenntnisse
          - listitem [ref=f14e162]: Du hast gute Kommunikationsskills und bist offen, dein Wissen als Mentor weiterzutragen
          - listitem [ref=f14e163]: Du hast Ideen und kannst dafür Begeistern
          - listitem [ref=f14e164]: Du hast ein Studium in der Informatik, Software Engineering oder vergleichbar
    - generic [ref=f14e165]:
      - heading "Unsere Benefits" [level=2] [ref=f14e166]
      - generic [ref=f14e167]:
        - button "<p>Deine Arbeitszeiten gestaltest du flexibel und kannst diese in Absprache mit deiner F&uuml;hrungskraft an deine Aufgaben anpassen. So bestimmst du selbst, wie deine gesunde Work-Life-Balance aussieht.</p>" [ref=f14e170] [cursor=pointer]:
          - figure [ref=f14e171]
        - button "<p>Unsere Mitarbeitenden liegen uns sehr am Herzen. Du wirst Teil einer wertsch&auml;tzenden und offenen Unternehmenskultur mit flachen Hierarchien und Duz-Kultur.</p>" [ref=f14e174] [cursor=pointer]:
          - figure [ref=f14e175]
        - button "<p>Du erh&auml;ltst deinen pers&ouml;nlichen Dienstwagen der Marke BMW inklusive Tankkarte und kannst diesen jederzeit auch privat nutzen. Alternativ steht dir ein monatliches Mobilit&auml;tsbudget zur Verf&uuml;gung.&nbsp;</p>" [ref=f14e178] [cursor=pointer]:
          - figure [ref=f14e179]
        - button "<p>Deine Gesundheit ist uns wichtig. Bei uns hast du vielf&auml;ltige M&ouml;glichkeiten, dich fit zu halten. Nutze kostenlos unsere eigenen Fitnessstudios oder genie&szlig;e verg&uuml;nstigte Fitnessangebote im Raum Heilbronn.</p>" [ref=f14e182] [cursor=pointer]:
          - figure [ref=f14e183]
        - button "<p>Mit vielf&auml;ltigen Weiterbildungsm&ouml;glichkeiten unterst&uuml;tzen wir dich individuell dabei, dich &nbsp;kontinuierlich fachlich sowie pers&ouml;nlich zu entfalten.&nbsp;</p>" [ref=f14e186] [cursor=pointer]:
          - figure [ref=f14e187]
        - button "<p>Mit unserem Partner Corporate Benefits kannst du dich monatlich &uuml;ber Rabatte in den unterschiedlichsten Kategorien von Dienstleistungen &uuml;ber Bekleidung bis hin zu Hotels freuen. Au&szlig;erdem kannst du als Mitarbeiter verg&uuml;nstigt unsere einzigartigen Restaurants genie&szlig;en.</p>" [ref=f14e190] [cursor=pointer]:
          - figure [ref=f14e191]
