            - generic [ref=f13e133]: "2271"
    - paragraph [ref=f13e138]: "Schwarz Digits schafft das technologische Fundament für digitale Entscheidungsfreiheit in Europa. Als IT- und Digitalsparte der Schwarz Gruppe entwickeln und verantworten wir einerseits die IT-Infrastrukturen für die Handelssparten Lidl und Kaufland sowie die Schwarz Produktion und PreZero. Gleichzeitig agieren wir als unabhängiger Anbieter am externen Markt, um Unternehmen in ganz Europa bei ihrer digitalen Transformation zu unterstützen. Unsere Kernleistungen bündeln wir in den Bereichen Cloud, Cyber Security, Data & AI, Communication und Workspace. Trage auch du zur digitalen Entscheidungsfreiheit in Europa bei.Bei uns arbeitest du an der Schnittstelle zwischen Agilität und Sicherheit: Du profitierst von den schnellen Entscheidungswegen, genießt echte Gestaltungsspielräume in deinen Projekten und baust dabei auf das stabile Fundament der Schwarz Gruppe."
    - generic [ref=f13e139]:
      - generic [ref=f13e140]:
        - heading "Deine Aufgaben" [level=3] [ref=f13e141]
        - list [ref=f13e144]:
          - listitem [ref=f13e145]: Du arbeitest in selbstorganisierten und kleinen Teams, welche in kurzen Zyklen large-scale Systeme entwickeln und ausliefern.
          - listitem [ref=f13e146]: Du bist an allen Phasen des Software-Engineerings beteiligt; von Konzeption und Design über Implementierung, Testing und Auslieferung, bis hin zum Produktionsbetrieb und der ständigen Verbesserung des Produkts.
          - listitem [ref=f13e147]: Du implementierst containerbasierte Softwarelösungen mit Go und Vue.js und übernimmst dabei die Verantwortung im Sinne von YBIYRI.
          - listitem [ref=f13e148]: Du hast Spaß daran, neue Technologien zu erlernen und gemeinsam unsere Systeme kontinuierlich voranzubringen!
      - generic [ref=f13e149]:
        - heading "Dein Profil" [level=3] [ref=f13e150]
        - list [ref=f13e153]:
          - listitem [ref=f13e154]: Du hast ein erfolgreich abgeschlossenes Studium der Informatik, Physik oder Mathematik oder eine vergleichbare Ausbildung.
          - listitem [ref=f13e155]: Du begeisterst dich für das Lösen komplexer Probleme und möchtest in einem Team arbeiten, das diesen Ehrgeiz teilt.
          - listitem [ref=f13e156]: Du lernst schnell und verbesserst deine Produkte kontinuierlich auf Basis von Metriken und A/B/n-Tests.
          - listitem [ref=f13e157]: Du hast bereits einschlägige Erfahrungen in der Full-Stack-Entwicklung.
          - listitem [ref=f13e158]: Du verfügst über Kenntnisse in Go und TypeScript und begeisterst dich für Testautomatisierung, Continuous Delivery und die Arbeit in verteilten Systemen in der Cloud.
          - listitem [ref=f13e159]: Du arbeitest gerne in internationalen Teams und verfügst über gute Kommunikations- und Englischkenntnisse.
    - generic [ref=f13e160]:
      - heading "Unsere Benefits" [level=2] [ref=f13e161]
      - generic [ref=f13e162]:
        - button "<p>Du &uuml;bernimmst verantwortungsvolle Aufgaben, treibst Projekte mit Mehrwert aktiv voran und tr&auml;gst dazu bei, Risiken fr&uuml;hzeitig zu erkennen und zu minimieren.</p>" [ref=f13e165] [cursor=pointer]:
          - figure [ref=f13e166]
        - button "<p>Du teilst deine Leidenschaft f&uuml;r IT und Digitalisierung mit &uuml;ber 4.000 Kollegen. Gemeinsam k&ouml;nnen wir voneinander lernen und uns gegenseitig inspirieren.&nbsp;</p>" [ref=f13e169] [cursor=pointer]:
          - figure [ref=f13e170]
        - button "<p>Mit vielf&auml;ltigen Weiterbildungsm&ouml;glichkeiten unterst&uuml;tzen wir dich individuell dabei, dich &nbsp;kontinuierlich fachlich sowie pers&ouml;nlich zu entfalten.&nbsp;</p>" [ref=f13e173] [cursor=pointer]:
          - figure [ref=f13e174]
        - button "<p>Unsere Mitarbeitenden liegen uns sehr am Herzen. Du wirst Teil einer wertsch&auml;tzenden und offenen Unternehmenskultur mit flachen Hierarchien und Duz-Kultur.</p>" [ref=f13e177] [cursor=pointer]:
          - figure [ref=f13e178]
        - button "<p>Du wirkst an internationalen Projekten mit und treibst unsere einzigartigen Cloud Native L&ouml;sungen aktiv voran.</p>" [ref=f13e181] [cursor=pointer]:
          - figure [ref=f13e182]
        - button "<p>Deine Arbeitszeiten gestaltest du flexibel und kannst diese in Absprache mit deiner F&uuml;hrungskraft an deine Aufgaben anpassen. So bestimmst du selbst, wie deine gesunde Work-Life-Balance aussieht.</p>" [ref=f13e185] [cursor=pointer]:
          - figure [ref=f13e186]
